plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionFile = file("${rootDir}/../version.txt")
def appVersionName = versionFile.exists() ? versionFile.text.trim() : "1.0.2"
def versionParts = appVersionName.split("\\.")
def appVersionCode = (versionParts.length >= 3) ? (versionParts[0].toInteger() * 100 + versionParts[1].toInteger() * 10 + versionParts[2].toInteger()) : 3

android {
    namespace 'com.yanich.desksound'
    compileSdk 34

    defaultConfig {
        applicationId "com.yanich.desksound"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
