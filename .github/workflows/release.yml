name: Multi-Platform Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-and-android:
    name: Build Windows & Android Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Sync Version Header
        shell: powershell
        run: |
          .\scripts\sync_version.ps1

      - name: Build Windows Server GUI (.exe)
        shell: cmd
        run: |
          set /p VERSION=<version.txt
          cd server
          rc.exe /nologo /fo resource.res resource.rc
          cl.exe /utf-8 /EHsc /std:c++17 src\main.cpp src\gui_app.cpp src\custom_widgets.cpp src\config_manager.cpp src\logger.cpp src\network_server.cpp src\audio_wasapi.cpp thirdparty\imgui\imgui.cpp thirdparty\imgui\imgui_draw.cpp thirdparty\imgui\imgui_widgets.cpp thirdparty\imgui\imgui_tables.cpp thirdparty\imgui\imgui_impl_win32.cpp thirdparty\imgui\imgui_impl_dx11.cpp resource.res /Iinclude /Ithirdparty\imgui /Fe:..\desksound.exe /link /subsystem:windows d3d11.lib d3dcompiler.lib Ws2_32.lib Advapi32.lib Ole32.lib
          cd ..
          if exist desksound.exe (
              copy /Y desksound.exe yanich-desksound_v%VERSION%.exe
          ) else (
              exit /b 1
          )

      - name: Setup Java 17 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Build Android Receiver Client (.apk)
        shell: powershell
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          Set-Location client-android
          if (Test-Path "local.properties") { Remove-Item "local.properties" -Force }
          .\gradlew.bat assembleRelease --no-daemon
          Set-Location ..
          $expectedApk = "client-android\app\build\outputs\apk\release\yanich-desksound_v$ver.apk"
          if (Test-Path $expectedApk) {
              Copy-Item -Path $expectedApk -Destination "yanich-desksound_v$ver.apk" -Force
              Write-Host "[+] Found APK: yanich-desksound_v$ver.apk"
          } else {
              $anyApk = Get-ChildItem "client-android\app\build\outputs\apk\release\*.apk" | Select-Object -First 1
              if ($anyApk) {
                  Copy-Item -Path $anyApk.FullName -Destination "yanich-desksound_v$ver.apk" -Force
                  Write-Host "[+] Copied fallback APK to yanich-desksound_v$ver.apk"
              } else {
                  throw "[-] Android APK build output not found!"
              }
          }

      - name: Upload Windows & Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-and-android-assets
          path: |
            yanich-desksound_v*.exe
            yanich-desksound_v*.apk

  build-linux:
    name: Build Linux Server Binary & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libglfw3-dev libgl1-mesa-dev build-essential cmake pkg-config

      - name: Compile Linux Server Binary & Package
        run: |
          chmod +x scripts/build_linux.sh
          bash scripts/build_linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            yanich-desksound_v*-linux-x64
            yanich-desksound_v*-linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-and-android, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows & Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-and-android-assets
          path: ./release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: ./release-assets

      - name: Display Prepared Assets
        run: |
          echo "Assets ready for release:"
          ls -la ./release-assets

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          name: Yanich DeskSound ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
